<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="%COR_TEMA%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTop Rep</title>
    <script>
      // Aplica o tema salvo antes de o React montar (evita piscar branco).
      // Mesma chave e regras de src/shared/domain/tema.ts; claro é o padrão.
      (() => {
        var preferencia = "claro";
        var salvo = null;
        try {
          salvo = localStorage.getItem("vtop:tema");
          if (salvo === "claro" || salvo === "escuro" || salvo === "sistema") {
            preferencia = salvo;
          }
        } catch (_e) {}
        var escuro =
          preferencia === "escuro" ||
          (preferencia === "sistema" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var raiz = document.documentElement;
        raiz.setAttribute("data-tema", escuro ? "escuro" : "claro");
        raiz.style.colorScheme = escuro ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
